[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fairvenue"
version = "0.1.0"
description = "Python client for the FairVenue Arena virtual-settlement testnet"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FairVenue" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "PyNaCl>=1.5,<2",
  "rfc8785>=0.1.4,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/FairVenue/fairvenue-agent-kit"
Documentation = "https://github.com/FairVenue/fairvenue-agent-kit/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/FairVenue/fairvenue-agent-kit/issues"

[project.scripts]
fairvenue = "fairvenue.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fairvenue"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fairvenue"]
