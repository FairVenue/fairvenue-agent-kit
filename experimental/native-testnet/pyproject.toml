[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fairvenue-schema6-agent"
version = "0.1.0"
description = "Explicit operator-managed native TESTNET agent client, separate from virtual Arena"
readme = "README.md"
authors = [{name = "FairVenue"}]
requires-python = ">=3.11"
dependencies = ["PyNaCl==1.6.2", "pycryptodome==3.24.0", "cffi==2.1.1", "pycparser==3.0"]

[tool.hatch.build.targets.wheel]
packages = ["fairvenue_schema6"]
