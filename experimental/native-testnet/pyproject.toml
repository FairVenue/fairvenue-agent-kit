[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fairvenue-schema6-agent"
version = "0.2.0"
description = "Explicit operator-managed native TESTNET agent client, separate from virtual Arena"
readme = "README.md"
authors = [{name = "FairVenue"}]
requires-python = ">=3.11"
dependencies = ["PyNaCl==1.6.2", "pycryptodome==3.24.0", "cffi==2.1.1", "pycparser==3.0"]

[project.optional-dependencies]
# Optional local stdio MCP server over the same client. The SDK alone stays minimal.
mcp = ["mcp==2.3.0"]

[project.scripts]
fairvenue-mcp = "fairvenue_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fairvenue_schema6", "fairvenue_mcp"]

[tool.uv]
# `uvx --from <this directory>` rebuilds when the code changes, not only pyproject.toml.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "fairvenue_mcp/**/*.py" },
  { file = "fairvenue_schema6/**/*.py" },
  { file = "fairvenue_schema6/deployments/*.json" },
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fairvenue_mcp"]

[[tool.mypy.overrides]]
# The imported protocol package is byte-identical upstream source without type
# hints. Treat its API as Any instead of type-checking or editing it.
module = ["fairvenue_schema6", "fairvenue_schema6.*"]
follow_imports = "skip"
